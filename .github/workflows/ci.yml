name: OrgPulse CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Download NLTK data
        run: python -m nltk.downloader stopwords punkt vader_lexicon punkt_tab

      - name: Run tests (exclude slow integration tests)
        run: pytest tests/ -v -m "not slow" --cov=src --cov-report=xml --ignore=tests/test_ona.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4